# Structural lint and unit tests. Runs on the glibc erlang image, where macula
# resolves a prebuilt QUIC NIF. Its other NIFs always build from source, and
# macula_cbor_nif's compile hook fails without cargo rather than skip, so this
# job installs a Rust toolchain: the same step as hecate-om's service template
# and hecate-stations. The alpine image build forces a source build of
# everything; see the Containerfile for why.

name: lint-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      # ⚠ MUST MATCH THE `Containerfile' beside it. See the note there.
      image: erlang:28
    steps:
      - uses: actions/checkout@v4
      # video_clip_scan.erl's tests shell out to ffprobe/ffmpeg against a
      # real fixture -- the erlang:28 image doesn't ship them.
      #
      # cmake, build-essential: this service has its own reckon-db store,
      # pulling in khepri/ra/reckon_db's own RocksDB-backed native deps --
      # same gap found and fixed today in hecate-warden/hecate-sentinel's
      # lint.yml (there via hecate_om 0.15's barrel_docdb). Newly exposed
      # here, not newly introduced: this job hadn't run a genuinely fresh
      # dependency fetch in a while.
      #
      # curl: the Rust toolchain installer below.
      - run: apt-get update && apt-get install -y --no-install-recommends ffmpeg cmake build-essential curl
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rebar3 lint
      - run: rebar3 eunit
