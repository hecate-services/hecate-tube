# Structural lint and unit tests. Runs on the glibc erlang image, where macula
# resolves a prebuilt QUIC NIF and no Rust toolchain is needed. The alpine image
# build forces a source build instead; see the Containerfile for why.

name: lint-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      # ⚠ MUST MATCH THE `Containerfile' beside it. See the note there.
      image: erlang:28
    steps:
      - uses: actions/checkout@v4
      # video_clip_scan.erl's tests shell out to ffprobe/ffmpeg against a
      # real fixture -- the erlang:28 image doesn't ship them.
      - run: apt-get update && apt-get install -y --no-install-recommends ffmpeg
      - run: rebar3 lint
      - run: rebar3 eunit
